<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GazeStar — verificación 16:9</title>
<style>
  :root{--bg:#0d1117;--ink:#e6edf3;--dim:#8b949e;--line:#2b3440}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 ui-sans-serif,system-ui,Segoe UI,sans-serif}
  header{padding:16px 24px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 4px;font-size:15px}
  header p{margin:0;color:var(--dim);font-size:12.5px}
  main{padding:24px;display:flex;justify-content:center}
  /* El componente: 16:9 exacto */
  #root{position:relative;width:min(900px,100%);aspect-ratio:16/9;
        overflow:hidden;border-radius:12px}
  #fondo{position:absolute;inset:0;background-image:url(fondo.webp);
         background-size:cover;background-position:center;background-color:#1E7FD4}
  #sprite{position:absolute;top:0;left:52.5%;height:100%;aspect-ratio:1/1;
          transform:translateX(-50%);
          background-repeat:no-repeat;will-change:background-position,transform}
  .hud{position:absolute;left:10px;top:10px;padding:6px 9px;border-radius:6px;
       background:rgba(0,0,0,.8);color:#7ee787;pointer-events:none;white-space:pre;
       font:500 11px/1.5 ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<header>
  <h1>GazeStar — verificación del componente en 16:9</h1>
  <p>Misma matemática que <code>GazeStar.tsx</code>, mismos activos. Mueve el cursor por la ventana.</p>
</header>
<main>
  <div id="root">
    <div id="fondo"></div>
    <div id="sprite"></div>
    <div class="hud" id="hud"></div>
  </div>
</main>
<script>
"use strict";
// --- identico a GazeStar.tsx -------------------------------------------
const COLS=12, ROWS=12, CENTER=0;
const RADIOS=[
 {nom:"E",ang:0,ini:1,len:20},    {nom:"NE",ang:-45,ini:21,len:20},
 {nom:"N",ang:-90,ini:41,len:20}, {nom:"NW",ang:-135,ini:61,len:20},
 {nom:"W",ang:180,ini:81,len:20}, {nom:"SW",ang:135,ini:101,len:20},
 {nom:"S",ang:90,ini:121,len:20},
];
const GRADOS=180/Math.PI;
const REACH_X=.5, REACH_Y=.5, SMOOTH=.16, NUDGE_X=18, NUDGE_Y=16, DEAD=.04;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

function elegirCelda(nx,ny){
  const m=Math.min(1,Math.hypot(nx,ny));
  const ang=Math.atan2(ny,nx)*GRADOS;
  let mejor=RADIOS[0], err=1e9;
  for(const r of RADIOS){ let d=Math.abs(ang-r.ang); if(d>180) d=360-d;
    if(d<err){ err=d; mejor=r; } }
  const mEf=m*Math.pow(Math.max(Math.cos(err/GRADOS),0),2.5);
  const celda = mEf<DEAD ? CENTER
    : mejor.ini+Math.min(mejor.len-1,Math.round(mEf*(mejor.len-1)));
  const rad=mejor.ang/GRADOS;
  return { celda, nombre: mEf<DEAD?"centro":mejor.nom,
           resX: nx-mEf*Math.cos(rad), resY: ny-mEf*Math.sin(rad) };
}

const sprite=document.getElementById("sprite"), root=document.getElementById("root"),
      hud=document.getElementById("hud");
let atlas="atlas-lo.webp", hiListo=false;
function aplicarAtlas(){
  sprite.style.backgroundImage="url("+atlas+")";
  sprite.style.backgroundSize=(COLS*100)+"% "+(ROWS*100)+"%";
}
aplicarAtlas();
// el grande solo con raton
if (matchMedia("(pointer: fine)").matches){
  const img=new Image(); img.src="atlas-hi.webp";
  const listo=()=>{ atlas="atlas-hi.webp"; hiListo=true; aplicarAtlas(); pintar(now.x,now.y); };
  img.decode ? img.decode().then(listo,listo) : (img.onload=listo);
}

function pintar(nx,ny){
  const r=elegirCelda(nx,ny);
  const col=r.celda%COLS, row=(r.celda/COLS)|0;
  sprite.style.backgroundPosition=
    (col*100/(COLS-1)).toFixed(4)+"% "+(row*100/(ROWS-1)).toFixed(4)+"%";
  sprite.style.transform=
    "translateX(calc(-50% + "+(r.resX*NUDGE_X).toFixed(2)+"px)) rotateX("+(-r.resY*NUDGE_Y).toFixed(2)+"deg)";
  hud.textContent="atlas "+(hiListo?"alta":"ligero")+"\nnx "+nx.toFixed(2)+"   ny "+ny.toFixed(2)+
                  "\nradio "+r.nombre+"   celda "+r.celda;
  return r;
}

const target={x:0,y:0}, now={x:0,y:0}; let raf=null;
function frame(){
  raf=null;
  now.x+=(target.x-now.x)*SMOOTH; now.y+=(target.y-now.y)*SMOOTH;
  pintar(now.x,now.y);
  if(Math.abs(target.x-now.x)>.0015||Math.abs(target.y-now.y)>.0015) sched();
}
function sched(){ if(raf===null) raf=requestAnimationFrame(frame); }
addEventListener("pointermove",e=>{
  const r=root.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  target.x=clamp((e.clientX-cx)/Math.max(1,innerWidth*REACH_X),-1,1);
  target.y=clamp((e.clientY-cy)/Math.max(1,innerHeight*REACH_Y),-1,1);
  sched();
},{passive:true});
document.addEventListener("pointerleave",()=>{ target.x=0; target.y=0; sched(); });
pintar(0,0);
</script>
</body>
</html>
